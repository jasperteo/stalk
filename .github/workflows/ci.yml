name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Install dependencies
        run: deno ci
      - name: Format check
        run: deno task fmt --check
      - name: Lint and typecheck
        run: deno task lint
      - name: Test
        run: deno task test
        env:
          CI: "1"
