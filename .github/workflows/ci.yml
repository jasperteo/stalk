name: CI

on:
  push:
    branches: [main, socket-ci]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - uses: pnpm/setup@v2.0.2
        with:
          cache: false
          install: false
      - name: Firewall version
        run: sfw --version
      - name: Proxy environment
        run: sfw sh -c 'env | grep -iE "proxy|cert|cainfo" | sort' || true
      - name: System CA bundle
        run: ls -l /etc/ssl/certs/ca-certificates.crt && grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt
      - name: Stripped environment
        run: sfw env -u SSL_CERT_FILE -u SSL_CERT_DIR sh -c 'env | grep -iE "proxy|cert|cainfo" | sort' || true
      - name: Install dependencies
        run: sfw env -u SSL_CERT_FILE -u SSL_CERT_DIR pnpm ci
        env:
          SFW_DEBUG: "true"
      - name: Firewall report
        if: always()
        run: cat "$SFW_JSON_REPORT_PATH" || echo "no report at $SFW_JSON_REPORT_PATH"
      - name: Format check
        run: pnpm fmt --check
      - name: Lint and typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          CI: "1"
