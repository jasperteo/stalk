name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.4
          cache: true
      - name: Install dependencies
        run: sfw deno ci
      - name: Format check
        run: deno task fmt --check
      - name: Lint and typecheck
        run: deno task lint
      - name: Test
        run: deno task test
        env:
          CI: "1"
