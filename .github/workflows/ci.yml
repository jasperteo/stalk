name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free
      - uses: pnpm/setup@v2.0.2
        with:
          cache: true
          install: false
      - name: Install dependencies
        run: sfw pnpm ci
      - name: Format check
        run: pnpm fmt --check
      - name: Lint and typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          CI: "1"
